openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /question-types:
    get:
      operationId: getQuestionTypes
      tags: [practice]
      summary: List shared question types grouped by kind
      security:
        - sessionCookie: []
      responses:
        "200":
          description: All question types, alphabetically sorted within each kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupedQuestionTypes"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: interviewprep.sid
  schemas:
    QuestionType:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum: [case, behavioral]
    GroupedQuestionTypes:
      type: object
      required: [case, behavioral]
      properties:
        case:
          type: array
          items:
            $ref: "#/components/schemas/QuestionType"
        behavioral:
          type: array
          items:
            $ref: "#/components/schemas/QuestionType"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

