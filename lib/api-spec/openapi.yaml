openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /case-sections:
    get:
      operationId: getCaseSections
      summary: List shared case sections in scorecard order
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Ordered case sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseSection"
        "401":
          description: Login required
  /sessions:
    get:
      operationId: listSessions
      security: [{sessionCookie: []}]
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: kind
          schema:
            type: string
            enum: [case, behavioral]
        - in: query
          name: type
          schema:
            type: integer
        - in: query
          name: score
          schema:
            type: string
            enum: [low, mid, high]
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, oldest, highest, lowest]
        - in: query
          name: starred
          description: When true, return only the current user's starred sessions.
          schema:
            type: boolean
      responses:
        "200":
          description: Matching owned sessions and the user's total count before filters. Invalid parameters are ignored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
    post:
      operationId: createSession
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSessionDetail"
        "400":
          $ref: "#/components/responses/InvalidSession"
  /sessions/{id}/star:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    post:
      operationId: starSession
      summary: Star an owned session, idempotently
      security: [{sessionCookie: []}]
      responses:
        "204":
          description: Starred, including when already starred
        "401":
          description: Login required
        "404":
          description: Session not found
    delete:
      operationId: unstarSession
      summary: Unstar an owned session, idempotently
      security: [{sessionCookie: []}]
      responses:
        "204":
          description: Unstarred, including when already unstarred
        "401":
          description: Login required
        "404":
          description: Session not found
  /sessions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      operationId: getSession
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSessionDetail"
        "404":
          description: Session not found
    put:
      operationId: updateSession
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSessionDetail"
        "400":
          $ref: "#/components/responses/InvalidSession"
        "404":
          description: Session not found
    delete:
      operationId: deleteSession
      security: [{sessionCookie: []}]
      responses:
        "204":
          description: Deleted
        "404":
          description: Session not found
  /question-types:
    get:
      operationId: getQuestionTypes
      tags: [practice]
      summary: List shared question types grouped by kind
      security:
        - sessionCookie: []
      responses:
        "200":
          description: All question types, alphabetically sorted within each kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupedQuestionTypes"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    InvalidSession:
      description: Invalid session fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionValidationError"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: interviewprep.sid
  schemas:
    SessionList:
      type: object
      required: [sessions, total]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/PracticeSession"
        total:
          type: integer
          description: Total number of sessions owned by this user, before search or filters.
    CaseSection:
      type: object
      required: [id, name, display_order]
      properties:
        id:
          type: integer
        name:
          type: string
        display_order:
          type: integer
    SectionScoreInput:
      type: object
      required: [section_id, score]
      properties:
        section_id:
          type: integer
          minimum: 1
          maximum: 2147483647
        score:
          type: integer
          minimum: 1
          maximum: 5
        went_well:
          type: [string, "null"]
          maxLength: 4000
        to_improve:
          type: [string, "null"]
          maxLength: 4000
    SectionScore:
      allOf:
        - $ref: "#/components/schemas/SectionScoreInput"
        - type: object
          required: [id, section_name, display_order]
          properties:
            id:
              type: integer
            section_name:
              type: string
            display_order:
              type: integer
    PracticeSessionDetail:
      allOf:
        - $ref: "#/components/schemas/PracticeSession"
        - type: object
          required: [section_scores]
          properties:
            section_scores:
              type: array
              items:
                $ref: "#/components/schemas/SectionScore"
    SessionInput:
      type: object
      required: [session_date, question_type_id, prompt, format, overall_score]
      properties:
        section_scores:
          description: Scored sections only; omit N/A sections. Empty or omitted replaces all scores with none. Nonempty scores are rejected for behavioral sessions. Sections must exist and cannot repeat.
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/SectionScoreInput"
        session_date:
          description: Required valid calendar date, not in the future.
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        question_type_id:
          type: integer
          minimum: 1
          maximum: 2147483647
        prompt:
          description: Trimmed before validation; whitespace-only prompts are rejected.
          type: string
          minLength: 1
          maxLength: 4000
        format:
          type: string
          enum: [solo, partner, mock]
        overall_score:
          type: integer
          minimum: 1
          maximum: 5
        duration_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 600
        went_well:
          type: [string, "null"]
          maxLength: 4000
        to_improve:
          type: [string, "null"]
          maxLength: 4000
    PracticeSession:
      allOf:
        - $ref: "#/components/schemas/SessionInput"
        - type: object
          required: [id, question_type_name, kind, created_at, starred]
          properties:
            starred:
              type: boolean
            id:
              type: integer
            question_type_name:
              type: string
            kind:
              type: string
              enum: [case, behavioral]
            created_at:
              type: string
    SessionValidationError:
      type: object
      required: [errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
    QuestionType:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum: [case, behavioral]
    GroupedQuestionTypes:
      type: object
      required: [case, behavioral]
      properties:
        case:
          type: array
          items:
            $ref: "#/components/schemas/QuestionType"
        behavioral:
          type: array
          items:
            $ref: "#/components/schemas/QuestionType"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

